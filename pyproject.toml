[project]
name = "polychrome"
version = "0.0.1"
description = "Color palette extraction. Under development, not usable yet."
requires-python = ">=3.12"
classifiers = ["Development Status :: 1 - Planning"]
dependencies = ["pillow>=10"]

[dependency-groups]
dev = ["pytest>=8", "colorthief>=0.2.1"]
bench = ["colorthief>=0.2.1", "fast-colorthief>=0.0.5", "modern-colorthief>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
